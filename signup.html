<!DOCTYPE html>
<html lang="en" class="h-full">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CLINIC CLOUD STORAGE - Sign Up</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="auth-page">
            <div class ="auth-card">
                <h1 class="auth-title">
                    Create Your Clinic Cloud Storage Account
                </h1>

                <p class="auth-subtitle">
                    Sign up to access your clinic's cloud storage and manage patient records.
                </p>

                <div id="msg-box" class="hidden mb-5 px-4 py-3 rounded-lg text-sm font-medium"></div>

                <div class="mb-6">
                    <label class="block text-gray-700 mb-2 font-medium">
                        Full Name
                    </label>
                    
                    <input id="full_name"
                        type="text"
                        placeholder="Enter your full name"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 mb-2 font-medium">
                        Department
                    </label>

                    <input id="department"
                        type="text"
                        placeholder="Enter your department"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 mb-2 font-medium">
                        Email
                    </label>
                
                    <input id="email"
                        type="email"
                        placeholder="Enter your email"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 mb-2 font-medium">
                        Password
                    </label>

                    <input id="password"
                        type="password"
                        placeholder="Create a password"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 mb-2 font-medium">
                        Confirm Password
                    </label>
                    
                    <input id="confirm_password"
                        type="password"
                        placeholder="Confirm your password"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <button id="signup-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                    Create Account
                </button>

                <p class="auth-footer">
                    Already have an account? 
                    <a href="login.html">
                        Sign In
                    </a>
                </p>
            </div>

            <script>
                let csrfToken = '';

                async function initCsrf() {
                    try{
                        const res = await fetch('../api/csrf_token.php');
                        const data = await res.json();
                        csrfToken = data.csrf_token || '';
                    } catch (e) {}
                }

                const btn = document.getElementById('signup-btn');
                const msgBox = document.getElementById('msg-box');

                function showMsg(text, isError = true) {
                    msgBox.textContent = text;
                    msgBox.className = isError
                        ? 'mb-5 px-4 py-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 border border-red-200'
                        : 'mb-5 px-4 py-3 rounded-lg text-sm font-medium bg-green-50 text-green-700 border border-green-200';
                }

                btn.addEventListener('click', async () => {
                    const full_name = document.getElementById('full_name').value.trim();
                    const department = document.getElementById('department').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirm_password = document.getElementById('confirm_password').value;

                    if (!full_name || !department || !email || !password || !confirm_password) {
                        showMsg('All fields are required.'); return;
                    }
                    if (password.length < 8) {
                        showMsg('Password must be at least 8 characters.'); return;
                    }
                    if (password != confirm_password) {
                        showMsg('Passwords do not match.'); return;
                    }

                    btn.disabled = true;
                    btn.textContent = 'Creating Account...';

                    const form = new FormData();
                    form.append('full_name', full_name);
                    form.append('department', department);
                    form.append('email', email);
                    form.append('password', password);
                    form.append('confirm_password', confirm_password);
                    form.append('csrf_token', csrfToken);

                    try {
                        const res = await fetch('../api/signup.php', {method: 'POST', body: form});
                        const data = await res.json();

                        if (data.success) {
                            showMsg(data.message, false);
                            setTimeout(() =>window.location.href ='login.html', 3000);
                            btn.textContent='Account Created!';
                        } else {
                            showMsg(data.message);
                            btn.disabled = false;
                            btn.textContent ='Create Account';
                        }
                    } catch (err) {
                        showMsg('Server error. Please try again.');
                        btn.disabled = false;
                        btn.textContent='Create Account';
                    }
                });

                initCsrf();
            </script>
    </body>

</html>
