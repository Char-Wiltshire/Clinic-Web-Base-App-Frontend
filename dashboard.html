<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Main Dashboard</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen">
        <header class="bg-white border-b px-8 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">
                    Clinic Cloud Storage - Dashboard
                </h1>

                <p class = "text-sm text-gray-500">
                    Welcome to the clinic's cloud storage dashboard
                </p>
            </div>

            <button class="text-blue-600 hover:underline"
            onclick="window.location.href='login.html'">    
                Log Out
            </button>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-3 gap-6">
                <div class="col-span-2">
                    <div class="flex justify-between items-center mb-4">
                        <input
                            type="text"
                            placeholder="Search patient records..."
                            class="w-2/3 border border-gray-300 rounde-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        
                        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        + Add New Record
                        </button>
                    </div>

                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class ="w-full text-left">
                            <thread class="bg-gray-50 text-gray-600 text-sm">
                                <tr>
                                    <th class="p-3">Patient ID</th>
                                    <th class="p-3">Name</th>
                                    <th class="p-3">Department</th>
                                    <th class="p-3">Last Updated</th>
                                </tr>
                            </thread>

                            <tbody class="text-gray-700">
                                <tr class="border-t">
                                    <td class="p-3">P-01</td>
                                    <td class="p-3">Jane Doe</td>
                                    <td class="p-3">Human Resources</td>
                                    <td class="p-3">2024-06-01</td>
                                </tr>

                                <tr class="border-t">
                                    <td class="p-3">P-02</td>
                                    <td class="p-3">John Doe</td>
                                    <td class="p-3">Finance</td>
                                    <td class="p-3">2024-06-02</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-lg shadow">
                        <p class ="text-gray-500 text-sm">
                            Total Patients
                        </p>
                        <h2 class="text-2xl font-bold">
                            2
                        </h2>
                    </div>

                    <div class="bg-white p-5 rounded-lg shadow">
                        <p class ="text-gray-500 text-sm">
                            TOTAL FILES
                        </p>

                        <h2 class="text-2xl font-bold">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            
        </div>
    </body>
</html>
