<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add New Patient Record</title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen">
        <div class = "border-b bg-white px-8 py-4 flex items-center gap-4">
            <button
            onclick="window.location.href='dashboard.html'"
            class="text-gray-600 hover:text-gray-900">
                ← Back
            </button>

            <h1 class="text-xl font-semibold text-gray-800">
                Add New Patient
            </h1>
        </div>

        <div class="p-8 max-2-6wl mx-auto">
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-6">
                    Patient Information
                </h2>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm text-gray-600 mb-2">
                            Patient ID*
                        </label>

                        <input 
                        type="text"
                        placeholder="P-01"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-2">
                            Full Name*
                        </label>

                        <input 
                        type="text"
                        placeholder="Enter full name"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-2">
                            Gender*
                        </label>

                        <select class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-2">
                            Age*
                        </label>

                        <input 
                        type="number"
                        placeholder="Enter age"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-2">
                            Height(cm)*
                        </label>

                        <input 
                        type="number"
                        placeholder="Enter height"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-2">
                            Weight(kg)*
                        </label>

                        <input 
                        type="number"
                        placeholder="Enter weight"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-2">
                            Blood Pressure*
                        </label>

                        <input 
                        type="text"
                        placeholder="Enter blood pressure"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <labelclass="block text-sm text-gray-600 mb-2">
                            Blood Type*
                        </label>

                        <select class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>Select Blood Type</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                        </select>

                    </div>
                </div>

                <div class="mt-6">
                    <label class="block text-sm text-gray-600 mb-2">
                        Medical History
                    </label>

                    <textarea
                    rows="4"
                    placeholder="Enter medical history"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </textarea>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-6">
                    Upload Medical Files
                </h2>

                <div class="border-2 border-dashed border-gray-300 rounded-lg p-10 text-center">
                    <p class="text-gray-500">
                        Drop files here or click to <span class="text-blue-600 hover:underline cursor-pointer" onclick="document.getElementById('fileInput').click()">
                            browse
                        </span>
                    </p>

                    <p class="text-sm text-gray-400 mt-2">
                        PDF or image files only, up to 10MB
                    </p>
                </div>
            </div>

            <div class="flex justify-end gap-4">
                <button class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-700 rounded-lg"
                onclick="window.location.href='dashboard.html'">
                    Cancel
                </button>

                <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg"
                onclick="window.location.href='dashboard.html'">
                    Save Record
                </button>
            </div>
        </div>
    </body>
</html>
