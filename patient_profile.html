<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patient Profile</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="bg-gray-100 min-h-screen">

        <header class="bg-white border-b px-8 py-4 flex justify-between items-center">
            
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='dashboard.html'" 
                    class="text-gray-500 hover:text-gray-800 text-sm flex items-center gap-1">
                    ← Back
                </button>

                <div>
                    <h1 id="header-name" class="text-xl font-bold text-gray-800">Loading...</h1>
                    <p id="header-pid" class="text-sm text-gray-500"></p>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="edit-btn"
                    class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
                    Edit
                </button>

                <button id="delete-btn"
                    class="flex items-center gap-2 border border-red-300 hover:bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold">
                    Delete
                </button>
            </div>
        </header>

        <div class="bg-white border-b px-8">
            <div class="flex gap-0">
                <button id="tab-info" onclick="switchTab('info')"
                    class="tab-btn active-tab px-6 py-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600">
                    Patient Information
                </button>

                <button id="tab-files" onclick="switchTab('files')"
                    class="tab-btn px-6 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700">
                    Files <span id="file-count-badge" class="ml-1 bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>

        <div class="p-8 max-w-4xl mx-auto">
            <div id="panel-info">
                <div class="bg-white rounded-lg shadow p-6">
                    <div id="info-loading" class="text-center text-gray-400 py-8">Loading Patient Data...</div>

                    <div id="info-content" class="hidden">
                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Patient ID</p>
                                <p id="view-patient-id" class="text-gray-800 font semi-bold"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Full Name</p>
                                <p id="view-full-name" class="text-gray-800 font-semibold"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Gender</p>
                                <p id="view-gender" class="text-gray-800"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Age</p>
                                <p id="view-age" class="text-gray-800"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Height (cm)</p>
                                <p id="view-height" class="text-gray-800"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Weight (kg)</p>
                                <p id="view-weight" class="text-gray-800"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Blood Pressure</p>
                                <p id="view-bp" class="text-gray-800"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Blood Type</p>
                                <p id="view-blood-type" class="text-gray-800"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Department</p>
                                <p id="view-department" class="text-gray-800"></p>
                            </div>

                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Medical History / Notes</p>
                                <p id="view-history" class="text-gray-800 whitespace-pre-wrap"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="panel-files" class="hidden">
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-base font-semibold text-gray-700 mb-4">Upload New Files</h2>
                <div id="drop-zone"
                    class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition">
                
                    <p class="text-gray-500 text-sm">Drop files here or click to
                        <span class="text-blue-600 hover:underline">browse</span>
                    </p>

                    <p class="text-xs text-gray-400 mt-1">PDF or image files only, up to 10MB each</p>
                </div>

                <input type="file" id="fileInput" multiple accept=".pdf, image/*" class="hidden"
                    onchange="handleFileSelect(this.files)">
                
                <ul id="file-preview" class="mt-3 space-y-2"></ul>

                
            </div>
        </div>
    </body>
</html>
